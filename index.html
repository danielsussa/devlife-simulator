<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevLife Simulator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">DevLife <span>Simulator</span></div>
        <div id="clock" class="clock"></div>
        <div id="speeds" class="speeds"></div>
        <label class="toggle"><input type="checkbox" id="fastNights" checked /> <i class="fa-solid fa-forward"></i> fast-forward nights</label>
        <button id="restart" class="btn"><i class="fa-solid fa-rotate-right"></i> Restart</button>
        <button id="shareBtn" class="btn" title="Copy a link with the current settings"><i class="fa-solid fa-link"></i> Share</button>
        <button id="configBtn" class="btn"><i class="fa-solid fa-sliders"></i> Settings</button>
      </header>
      <main>
        <section id="stage"></section>
        <aside id="side">
          <div id="metrics"></div>
          <h3><i class="fa-solid fa-list-ul"></i> Events</h3>
          <ol id="log"></ol>
        </aside>
      </main>
      <section id="kanban"></section>
      <div id="config" class="drawer" hidden>
        <div class="drawer-head">
          <h2>Settings</h2>
          <button id="configClose" class="btn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="configForm"></form>
        <p class="hint">Changing the team, environments or seed restarts the simulation. Everything else applies immediately. The URL always carries the current setup (🔗 Share copies the link).</p>
        <button id="resetCfg" class="btn"><i class="fa-solid fa-arrow-rotate-left"></i> Reset to defaults</button>
        <p class="credit">Tiles: Kenney.nl (CC0)</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
